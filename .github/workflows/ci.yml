name: CI

on:
  pull_request:
  push:
    branches: [main]

# PR에서는 뒤이은 push가 앞선 run을 취소한다. required check는 head SHA 기준으로
# 평가되므로 오래된 SHA의 취소는 merge를 막지 않는다. main push는 취소하지 않는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# test와 typecheck는 외부 접근이 없다. 쓰기 권한도 secret도 필요하지 않다.
permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # packageManager 필드가 없으므로 pnpm 버전을 여기서 고정한다.
      # setup-node의 cache: pnpm이 store 경로를 물어보므로 pnpm이 먼저 있어야 한다.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: pnpm

      # store만 캐시된다. 의존성 그래프는 항상 lockfile에서 나오고
      # lockfile과 package.json이 어긋나면 여기서 실패한다.
      - run: pnpm install --frozen-lockfile

      - run: pnpm -r test
      - name: O1-7 hermetic operational acceptance
        run: pnpm acceptance:o1-7

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r typecheck
